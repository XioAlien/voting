app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  invite:
    default-max-members: ${INVITE_DEFAULT_MAX_MEMBERS:100}
    default-expire-hours: ${INVITE_DEFAULT_EXPIRE_HOURS:168}
    code-length: ${INVITE_CODE_LENGTH:8}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    must-change-password: ${BOOTSTRAP_ADMIN_MUST_CHANGE_PASSWORD:true}
  security:
    dev-token-enabled: ${DEV_TOKEN_ENABLED:true}

spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}

logging:
  level:
    com.vote.backend: ${APP_LOG_LEVEL:DEBUG}
